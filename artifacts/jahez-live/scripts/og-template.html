<!DOCTYPE html>
<!--
  Source of public/og.png (the 1200x630 share card matching the updated Hero section).
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../public/fonts/fonts.css" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #ffffff;
    color: #0f172a;
    font-family: 'Readex Pro', sans-serif;
  }
  .hero-canvas {
    width: 1200px;
    height: 630px;
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    align-items: center;
    gap: 24px;
    padding: 36px 68px 28px;
    position: relative;
  }
  .hero-copy {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .hero-prelude {
    font-size: 16px;
    font-weight: 500;
    color: #0f172a;
    margin: 0 0 14px;
  }
  h1 {
    font-family: 'Lalezar', sans-serif;
    font-weight: 400;
    font-size: 88px;
    line-height: 1.08;
    color: #0f172a;
    margin: 0;
  }
  .hero-line {
    display: block;
  }
  .hero-accent {
    position: relative;
    display: inline-block;
    padding-bottom: 10px;
  }
  .hero-accent::after {
    content: "";
    position: absolute;
    bottom: 4px;
    inset-inline: 0;
    height: 6px;
    border-radius: 99px;
    transform: rotate(-1deg);
    background: #e11d48;
  }
  .hero-description {
    font-size: 16.5px;
    line-height: 1.9;
    color: #0f172a;
    margin: 22px 0 28px;
    max-width: 520px;
  }
  .hero-actions {
    display: flex;
    align-items: center;
    gap: 26px;
  }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 28px;
    background: #e11d48;
    color: #ffffff;
    border: 2px solid #0f172a;
    border-radius: 17px;
    box-shadow: 4px 5px 0 #0f172a;
    font-family: 'Lalezar', sans-serif;
    font-size: 24px;
    line-height: 1.1;
    padding: 14px 26px;
  }
  .underlink {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 14.5px;
    font-weight: 600;
    color: #0f172a;
    padding-bottom: 6px;
    border-bottom: 1.5px solid #0f172a;
  }
  .hero-note {
    margin-top: 26px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12.5px;
    line-height: 1.55;
    color: #475569;
  }
  .hero-note b {
    color: #0f172a;
    font-weight: 700;
  }
  .note-line {
    width: 28px;
    height: 1.5px;
    background: #e11d48;
    display: inline-block;
  }
  .hero-artwork {
    position: relative;
    width: 100%;
    height: 570px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .hero-art-image {
    height: 555px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 16px 12px rgba(24, 21, 19, 0.11));
  }
  .hero-art-note {
    position: absolute;
    right: 6px;
    bottom: 96px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 16px;
    background: #fde047;
    color: #181513;
    border: 2px solid #181513;
    box-shadow: 3px 4px 0 #181513;
    border-radius: 12px;
    transform: rotate(7deg);
    font-family: 'Lalezar', sans-serif;
    font-size: 21px;
  }
  .star {
    position: absolute;
    color: #e11d48;
  }
  .star-one {
    top: 12px;
    right: 68px;
  }
  .star-two {
    bottom: 138px;
    left: 16px;
  }
</style>
</head>
<body>
  <div class="hero-canvas">
    <div class="hero-copy">
      <p class="hero-prelude">من مكانك، إلى ما تريد تعلّمه.</p>
      <h1>
        <span class="hero-line">السنتر جالك</span>
        <span class="hero-line hero-accent">لحد البيت.</span>
      </h1>
      <p class="hero-description">
        اختر ما تريد تعلّمه، وتعرّف إلى المدرس، واحجز حصتك. تعلّم معه مباشرة، واسأله حين تحتاج إلى شرح أوضح.
      </p>
      <div class="hero-actions">
        <div class="btn-primary">
          <span>اكتشف حصتك</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17V7h10"/><path d="M17 17 7 7"/></svg>
        </div>
        <div class="underlink">
          <span>هل ترغب في التدريس؟</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </div>
      </div>
      <div class="hero-note">
        <span class="note-line"></span>
        <span>مدرس تختاره.<br /><b>وحوار تتعلّم منه.</b></span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17"/><path d="M17 17H7V7"/></svg>
      </div>
    </div>

    <div class="hero-artwork">
      <span class="star star-one">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
      </span>
      <img class="hero-art-image" src="../public/images/learning-hero.webp" alt="" />
      <span class="hero-art-note">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        اسأل حتى تفهم.
      </span>
      <span class="star star-two">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
      </span>
    </div>
  </div>
</body>
</html>
