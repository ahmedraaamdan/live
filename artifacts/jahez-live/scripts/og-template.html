<!DOCTYPE html>
<!--
  Source of public/og.png (the 1200x630 share card). Regenerate with headless
  Edge/Chrome so the Arabic shapes correctly, then keep the PNG under 300 KB:
    msedge --headless=new --hide-scrollbars --virtual-time-budget=8000 \n      --window-size=1200,630 --screenshot=og.png file:///.../og-template.html
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Space+Grotesk:wght@700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Cairo', sans-serif;
    background:
      radial-gradient(620px 420px at 18% 60%, rgba(34,211,238,.28), transparent 70%),
      radial-gradient(700px 500px at 0% 0%, rgba(37,99,235,.45), transparent 70%),
      #0f172a;
    color: #f7f9fc;
    position: relative;
  }
  .grid { position: absolute; inset: 0; opacity: .08;
    background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size: 42px 42px; }
  .copy { position: absolute; right: 72px; top: 70px; width: 720px; }
  .brand { display: flex; align-items: center; gap: 14px; direction: ltr; justify-content: flex-end; }
  .mark { width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center;
    background: linear-gradient(135deg, #2563EB, #22D3EE); font: 700 32px 'Space Grotesk'; color: #fff; }
  .word { font: 700 38px 'Space Grotesk'; letter-spacing: -.5px; }
  .word span { background: linear-gradient(90deg, #2563EB, #22D3EE); -webkit-background-clip: text; color: transparent; }
  .live { display: inline-flex; align-items: center; gap: 10px; margin-top: 40px; padding: 8px 18px; border-radius: 999px;
    background: rgba(225,29,72,.16); border: 1px solid rgba(225,29,72,.5); color: #fda4af; font-weight: 800; font-size: 22px; }
  .live i { width: 12px; height: 12px; border-radius: 50%; background: #E11D48; box-shadow: 0 0 0 6px rgba(225,29,72,.25); }
  h1 { margin: 18px 0 0; font-weight: 900; font-size: 60px; line-height: 1.3; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #22D3EE, #60a5fa); -webkit-background-clip: text; color: transparent; }
  p { margin: 18px 0 0; font-size: 26px; font-weight: 600; color: #cbd5e1; line-height: 1.6; }
  .url { position: absolute; right: 72px; bottom: 48px; font: 700 22px 'Space Grotesk'; color: #94a3b8; direction: ltr; }
  .mascot { position: absolute; left: 40px; bottom: 20px; width: 440px; height: 440px; object-fit: contain;
    filter: drop-shadow(0 30px 40px rgba(0,0,0,.45)); }
  .glow { position: absolute; left: 70px; bottom: 30px; width: 380px; height: 70px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(34,211,238,.35), transparent); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <img class="mascot" src="https://gahez.space/mascot/robot-desk.webp" alt="" />
  <div class="copy">
    <div class="brand"><div class="word">Gahez <span>Live</span></div><div class="mark">G</div></div>
    <div class="live"><i></i> حصص لايف</div>
    <h1>حصص أونلاين مباشرة<br>مع <em>مدرسين حقيقيين</em></h1>
    <p>اكتشف الحصة، احجز مكانك، وادخل لايف من أي مكان.</p>
  </div>
  <div class="url">live.gahez.space</div>
</body>
</html>
